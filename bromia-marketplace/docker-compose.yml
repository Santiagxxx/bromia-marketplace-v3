version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bromia-backend
    ports:
      - "8080:8080"
    volumes:
      - bromia_data:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bromia-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  bromia_data:
